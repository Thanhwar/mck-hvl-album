<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <title>WEB - MCK (Spotify Layout)</title>
    <style>
        /* 📱 CHỈ ÁP DỤNG CHO ĐIỆN THOẠI (Màn hình < 768px) */
        @media (max-width: 768px) {
            /* Ẩn thanh kéo trên ĐT, giữ lại nút bấm loa */
            .volume-bar { 
                display: none !important; 
            }
            .volume-container { 
                display: flex !important; 
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .main-container {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
            background: #121212;
            margin: 8px;
            border-radius: 8px;
        }

        /* KHUNG CHÍNH (HEADER + LYRICS) */
        .content-panel {
            flex: 1;
            background: linear-gradient(180deg, #501c19 0%, #121212 100%);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            width: 100%;
        }
        .content-panel::-webkit-scrollbar { width: 6px; }
        .content-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }

        .song-header {
            display: flex;
            align-items: flex-end;
            gap: 20px;
            padding: 24px 24px 16px 24px;
        }

        .header-cover {
            width: 140px !important;
            height: 140px !important;
            min-width: 140px !important;
            min-height: 140px !important;
            border-radius: 8px;
            object-fit: contain !important;
            background-color: rgba(0, 0, 0, 0.2);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            flex-shrink: 0 !important;
        }

        .header-info { display: flex; flex-direction: column; gap: 6px; }
        .header-type { font-size: 0.8rem; font-weight: bold; text-transform: uppercase; color: #b3b3b3; }
        .header-title { font-size: 1.8rem; font-weight: 900; line-height: 1.2; word-break: break-word; }
        .header-sub { font-size: 0.85rem; color: #e0e0e0; }

        .header-action-bar {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 0 24px 16px 24px;
        }
        .btn-big-play {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #1db954;
            color: #000;
            border: none;
            font-size: 1.3rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .lyrics-section { padding: 0 24px 40px 24px; }
        .lyrics-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 16px; }
        .lyric-text {
            font-size: 1.05rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.7;
            white-space: pre-line;
            word-wrap: break-word;
        }

        /* CỘT DANH SÁCH CHỜ BÊN PHẢI */
        .queue-panel {
            width: 320px;
            background: #121212;
            border-left: 1px solid #282828;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: transform 0.3s ease;
        }
        .queue-panel.hidden { display: none; }

        .queue-header { font-size: 1rem; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .section-title { font-size: 0.85rem; color: #b3b3b3; font-weight: bold; margin-top: 10px; }

        .song-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
        }
        .song-item:hover, .song-item.active { background: #282828; }
        .song-item.active .song-item-title { color: #1db954; }

        .song-item-img { width: 44px; height: 44px; border-radius: 4px; object-fit: cover; }
        .song-item-info { flex: 1; overflow: hidden; }
        .song-item-title { font-size: 0.85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-item-artist { font-size: 0.75rem; color: #b3b3b3; margin-top: 2px; }

        /* PLAYER BAR DƯỚI CÙNG */
        .player-bar {
            height: 80px;
            background-color: #000000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            gap: 10px;
        }

        .now-playing { display: flex; align-items: center; gap: 10px; width: 30%; min-width: 120px; }
        .now-playing-img { width: 48px; height: 48px; border-radius: 4px; object-fit: cover; }
        .now-playing-title { font-size: 0.8rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .now-playing-artist { font-size: 0.7rem; color: #b3b3b3; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .player-center { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; max-width: 500px; }
        .controls { display: flex; align-items: center; gap: 14px; }
        .btn { background: none; border: none; color: #b3b3b3; font-size: 1rem; cursor: pointer; }
        .btn.active { color: #1db954; }
        .btn-play { background: #ffffff; color: #000; width: 32px; height: 32px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 0.9rem; }

        .progress-container { display: flex; align-items: center; gap: 8px; width: 100%; }
        .time-text { font-size: 0.7rem; color: #a7a7a7; width: 30px; text-align: center; }
        .progress-bar { flex: 1; -webkit-appearance: none; height: 3px; border-radius: 2px; background: #4d4d4d; outline: none; }
        .progress-bar::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #ffffff; }

        .player-right { display: flex; align-items: center; justify-content: flex-end; gap: 10px; width: 20%; }
        .volume-container { display: flex; align-items: center; gap: 6px; }
        .volume-bar { width: 60px; -webkit-appearance: none; height: 3px; border-radius: 2px; background: #4d4d4d; outline: none; }
        .volume-bar::-webkit-slider-thumb { -webkit-appearance: none; width: 8px; height: 8px; border-radius: 50%; background: #ffffff; }

        /* 📱 CSS RIÊNG DÀNH CHO ĐIỆN THOẠI (MÀN HÌNH < 768PX) */
        @media (max-width: 768px) {
            .main-container { margin: 0; border-radius: 0; }
            
            .song-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
                padding: 16px;
            }
            .header-cover {
                width: 120px !important;
                height: 120px !important;
                min-width: 120px !important;
                min-height: 120px !important;
            }
            .header-title { font-size: 1.4rem; }

            .header-action-bar { justify-content: center; padding-bottom: 12px; }
            .lyrics-section { padding: 0 16px 24px 16px; }
            .lyric-text { font-size: 0.95rem; line-height: 1.6; }

            /* Danh sách chờ biến thành menu trượt đè lên màn hình */
            .queue-panel {
                position: absolute;
                top: 0; right: 0; bottom: 0; left: 0;
                width: 100%;
                z-index: 10;
                background: #121212;
            }
            .queue-panel.hidden-mobile { display: none !important; }

            /* Nút âm lượng ẩn bớt trên điện thoại cho đỡ chật */
            .volume-container { display: none; }
            .player-right { width: auto; }
            .now-playing { width: 35%; }
        }
    </style>
</head>

<div class="main-container">
    <div class="content-panel" id="content-panel">
        <div class="song-header">
            <img id="main-cover" class="header-cover" src="" alt="Cover">
            <div class="header-info">
                <span class="header-type">Bài hát</span>
                <h1 id="main-title" class="header-title">Đang tải...</h1>
                <div id="main-sub" class="header-sub">RPT MCK • HVL</div>
            </div>
        </div>

        <div class="header-action-bar">
            <button class="btn-big-play" onclick="togglePlay()" id="big-play-btn">▶</button>
        </div>

        <div class="lyrics-section">
            <div class="lyrics-title">Lời bài hát</div>
            <div id="lyric-text" class="lyric-text">♪ Chọn bài hát để hiển thị lời ♪</div>
        </div>
    </div>

    <!-- CỘT DANH SÁCH CHỜ (ĐIỆN THOẠI MẶC ĐỊNH ẨN) -->
    <div class="queue-panel hidden-mobile" id="queue-panel">
        <div class="queue-header">
            <span>Danh sách chờ</span>
            <button class="btn" onclick="toggleQueuePanel()">✕</button>
        </div>
        <div class="section-title">Đang phát</div>
        <div id="current-playing-item"></div>
        
        <div class="section-title">Tiếp theo</div>
        <div id="queue-list" style="display: flex; flex-direction: column; gap: 6px;"></div>
    </div>
</div>

<div class="player-bar">
    <div class="now-playing">
        <img id="cover" class="now-playing-img" src="" alt="Cover">
        <div class="now-playing-info">
            <div id="title" class="now-playing-title">Đang tải...</div>
            <div id="artist" class="now-playing-artist">...</div>
        </div>
    </div>

    <div class="player-center">
        <div class="controls">
            <button id="shuffle-btn" class="btn" onclick="toggleShuffle()">🔀</button>
            <button class="btn" onclick="prevSong()">⏮</button>
            <button class="btn btn-play" id="play-btn" onclick="togglePlay()">▶</button>
            <button class="btn" onclick="nextSong()">⏭</button>
            <button id="repeat-btn" class="btn" onclick="toggleRepeat()">🔁</button>
        </div>
        <div class="progress-container">
            <span id="current-time" class="time-text">0:00</span>
            <input type="range" id="progress" class="progress-bar" value="0" min="0" max="100" oninput="seekSong()">
            <span id="duration-time" class="time-text">0:00</span>
        </div>
    </div>

    <div class="player-right">
        <button id="queue-btn" class="btn" onclick="toggleQueuePanel()" title="Danh sách chờ">📜</button>
        <div class="volume-container">
            <button class="btn" id="volume-icon" onclick="toggleMute()">🔊</button>
            <input type="range" id="volume" class="volume-bar" value="100" min="0" max="100" oninput="changeVolume()">
        </div>
    </div>
</div>

    let currentIndex = 0;
    let isShuffle = false;
    let isRepeat = false;

    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const bigPlayBtn = document.getElementById('big-play-btn');
    const progress = document.getElementById('progress');
    const currentTimeEl = document.getElementById('current-time');
    const durationTimeEl = document.getElementById('duration-time');
    const lyricText = document.getElementById('lyric-text');
    const volumeInput = document.getElementById('volume');

    function loadSong(index) {
        currentIndex = index;
        const song = playlist[currentIndex];
        
        document.getElementById('title').textContent = song.title;
        document.getElementById('artist').textContent = song.artist;
        document.getElementById('cover').src = song.cover;

        document.getElementById('main-title').textContent = song.title;
        document.getElementById('main-cover').src = song.cover;
        document.getElementById('main-sub').textContent = `${song.artist} • HVL`;

        audio.src = song.src;
        lyricText.textContent = song.lyrics || "♪ Chưa có lời bài hát ♪";

        renderQueue();
    }

    function renderQueue() {
        const currentPlayingItem = document.getElementById('current-playing-item');
        const queueList = document.getElementById('queue-list');
        
        const currentSong = playlist[currentIndex];
        currentPlayingItem.innerHTML = `
            <div class="song-item active">
                <img class="song-item-img" src="${currentSong.cover}">
                <div class="song-item-info">
                    <div class="song-item-title">${currentSong.title}</div>
                    <div class="song-item-artist">${currentSong.artist}</div>
                </div>
            </div>
        `;

        queueList.innerHTML = '';
        playlist.forEach((song, idx) => {
            if (idx !== currentIndex) {
                const div = document.createElement('div');
                div.className = 'song-item';
                div.onclick = () => { 
                    loadSong(idx); 
                    audio.play(); 
                    updatePlayIcons(true);
                    if (window.innerWidth <= 768) {
                        toggleQueuePanel(); // Tự động đóng queue sau khi chọn bài trên ĐT
                    }
                };
                div.innerHTML = `
                    <img class="song-item-img" src="${song.cover}">
                    <div class="song-item-info">
                        <div class="song-item-title">${song.title}</div>
                        <div class="song-item-artist">${song.artist}</div>
                    </div>
                `;
                queueList.appendChild(div);
            }
        });
    }

    function updatePlayIcons(isPlaying) {
        playBtn.textContent = isPlaying ? '⏸' : '▶';
        bigPlayBtn.textContent = isPlaying ? '⏸' : '▶';
    }

    function togglePlay() {
        if (audio.paused) {
            audio.play();
            updatePlayIcons(true);
        } else {
            audio.pause();
            updatePlayIcons(false);
        }
    }

    function nextSong() {
        currentIndex = isShuffle ? Math.floor(Math.random() * playlist.length) : (currentIndex + 1) % playlist.length;
        loadSong(currentIndex);
        audio.play();
        updatePlayIcons(true);
    }

    function prevSong() {
        currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
        loadSong(currentIndex);
        audio.play();
        updatePlayIcons(true);
    }

    function toggleShuffle() {
        isShuffle = !isShuffle;
        document.getElementById('shuffle-btn').classList.toggle('active', isShuffle);
    }

    function toggleRepeat() {
        isRepeat = !isRepeat;
        document.getElementById('repeat-btn').classList.toggle('active', isRepeat);
    }

    function changeVolume() {
        audio.volume = volumeInput.value / 100;
        document.getElementById('volume-icon').textContent = audio.volume === 0 ? '🔇' : '🔊';
    }

    let lastVolume = 1;

    function toggleMute() {
        const volumeIcon = document.getElementById('volume-icon');
        if (audio.volume > 0) {
            lastVolume = audio.volume;
            audio.volume = 0;
            volumeInput.value = 0;
            volumeIcon.textContent = '🔇';
        } else {
            audio.volume = lastVolume || 1;
            volumeInput.value = (lastVolume || 1) * 100;
            volumeIcon.textContent = '🔊';
        }
    }

    function toggleQueuePanel() {
        const panel = document.getElementById('queue-panel');
        const btn = document.getElementById('queue-btn');
        panel.classList.toggle('hidden-mobile');
        panel.classList.toggle('hidden');
        btn.classList.toggle('active');
    }

    audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
            progress.value = (audio.currentTime / audio.duration) * 100;
            currentTimeEl.textContent = formatTime(audio.currentTime);
            durationTimeEl.textContent = formatTime(audio.duration);
        }
    });

    function seekSong() {
        audio.currentTime = (progress.value / 100) * audio.duration;
    }

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    audio.addEventListener('ended', () => {
        if (isRepeat) audio.play();
        else nextSong();
    });

    loadSong(currentIndex);
</script>
